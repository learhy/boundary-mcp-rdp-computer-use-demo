# Boundary MCP RDP Computer Use Demo - Docker Compose
#
# Requires:
#   - KVM support (/dev/kvm) for the Windows VM
#   - Boundary Enterprise license (BOUNDARY_LICENSE env var or license file)
#   - At least 8GB free RAM for the Windows VM
#
# Services:
#   1. Boundary (controller + worker, enterprise dev mode) - ports 9220/9222
#   2. PostgreSQL (Boundary state store)
#   3. MinIO (S3-compatible storage for session recordings)
#   4. Windows VM (dockurr/windows with RDP on port 3389)

services:
  # ── Boundary Controller + Worker (Enterprise) ──────────────────────────
  boundary:
    image: hashicorp/boundary:latest
    container_name: rdp-demo-boundary
    ports:
      - "9220:9220"   # API
      - "9222:9222"   # Proxy
    environment:
      # Enterprise license - set via env var or mount license file
      # For HCP Boundary, use the HCP cluster instead
      BOUNDARY_LICENSE: "${BOUNDARY_LICENSE:-}"
      # Dev mode with enterprise features
      # -recovery-kms-type=none disables KMS (dev only)
    command: >
      boundary dev
      -bind=0.0.0.0
      -admin-name=admin
      -admin-password=adminadmin
      -worker-public-address=127.0.0.1:9222
      -database-url=postgres://boundary:boundarypw@db:5432/boundary?sslmode=disable
      -host-address=127.0.0.1
      -skip-alias-target-creation
      -recovery-kms-type=none
    depends_on:
      db:
        condition: service_healthy
    networks:
      rdp-net:
        ipv4_address: 10.30.0.10

  # ── PostgreSQL for Boundary ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rdp-demo-db
    environment:
      POSTGRES_USER: boundary
      POSTGRES_PASSWORD: boundarypw
      POSTGRES_DB: boundary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boundary -d boundary"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      rdp-net:
        ipv4_address: 10.30.0.20

  # ── MinIO (S3-compatible storage for session recordings) ───────────────
  minio:
    image: minio/minio:latest
    container_name: rdp-demo-minio
    ports:
      - "9230:9000"   # S3 API
      - "9231:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      rdp-net:
        ipv4_address: 10.30.0.30

  # ── Windows VM (requires KVM) ─────────────────────────────────────────
  # Uses dockurr/windows which runs Windows in Docker via QEMU
  # Requires /dev/kvm on the host
  # Windows Server 2022 evaluation ISO is downloaded automatically
  windows:
    image: dockurr/windows
    container_name: rdp-demo-windows
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/kvm
    environment:
      # Windows version: win11, win10, ltsc11, ltsc10, server2022, server2019
      VERSION: "server2022"
      # RDP username/password - set during Windows setup
      USERNAME: "Administrator"
      PASSWORD: "P@ssw0rd!23"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
    ports:
      - "13389:3389"   # RDP (mapped to host port 13389)
      - "15000:5000"   # VNC (for initial setup if needed)
    volumes:
      - windows-data:/storage
    depends_on:
      - boundary
    networks:
      rdp-net:
        ipv4_address: 10.30.0.40

volumes:
  windows-data:

networks:
  rdp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/16
